<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f6f3" />
    <title>Student OS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#"
        ><span class="mark">S</span
        ><span><b>studentOS</b><small>YOUR LEARNING SPACE</small></span></a
      ><button class="nav active" data-page="home">⌂ <span>Overview</span></button>
      <div class="navlabel">YOUR WORKSPACE</div>
      <div id="navigation"></div>
      <div class="sidefoot">
        <span class="avatar">✦</span
        ><span><b>My workspace</b><small>Everything in one place</small></span>
      </div>
    </aside>
    <main>
      <header>
        <div class="crumb">STUDENT OS <i>/</i> <b id="crumb">Overview</b></div>
        <div class="actions">
          <time id="today"></time><button class="icon" id="theme" title="Toggle dark mode">◐</button
          ><button class="button" id="new">＋ New entry</button>
        </div>
      </header>
      <div class="content">
        <section id="home"></section>
        <section id="database" class="hidden"></section>
      </div>
    </main>
    <dialog id="modal">
      <form id="form">
        <div class="modalhead">
          <div>
            <small>YOUR WORKSPACE</small>
            <h2 id="modal-title">Add entry</h2>
          </div>
          <button class="icon" type="button" id="close">×</button>
        </div>
        <div id="fields" class="fields"></div>
        <div class="modalfoot">
          <button class="quiet" type="button" id="cancel">Cancel</button
          ><button class="button">Save entry</button>
        </div>
      </form>
    </dialog>
    <div id="toast"></div>
    <script src="/app.js?v=3"></script>
  </body>
</html>
